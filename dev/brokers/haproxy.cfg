defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend servicebus
    bind :5673
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.len ge 4 }
    # An AMQP client opens with the bytes "AMQP"; anything else is the management HTTP API.
    acl is_amqp req.payload(0,4) -m bin 414d5150
    use_backend messaging if is_amqp
    default_backend management

backend messaging
    server emulator servicebus-emulator:5672

backend management
    server emulator servicebus-emulator:5300
