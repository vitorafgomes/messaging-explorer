# End-to-end tests: the Angular app in Chromium against the real API and brokers in containers the
# run starts, with a screenshot of every screen the flows reach, in the light and the dark theme.

name: E2E

on:
  push:
    branches: [main]
    paths: ['web-app/**', 'src/**']
  pull_request:
    branches: [main]
    paths: ['web-app/**', 'src/**']

concurrency:
  group: ${{ github.workflow }}-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end tests (Playwright, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        working-directory: web-app
        run: npm ci

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web-app/package-lock.json') }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: web-app
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: web-app
        run: npx playwright install-deps chromium

      - name: Build the API
        run: dotnet build src/ServiceBusExplorer.Api

      - name: End-to-end tests
        working-directory: web-app
        run: npx playwright test -c e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web-app/dist/e2e/screenshots/
          if-no-files-found: warn
